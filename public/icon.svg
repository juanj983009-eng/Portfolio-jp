<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo negro industrial -->
  <rect width="32" height="32" rx="4" fill="#050505"/>
  <!-- Borde técnico sutil -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" fill="none" stroke="#1F1F22" stroke-width="1"/>

  <!-- Monograma JP brutalista -->
  <!-- J: trazo vertical con gancho inferior -->
  <line x1="10" y1="7" x2="10" y2="21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  <path d="M10 21 Q10 25 6.5 25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" fill="none"/>

  <!-- P: trazo vertical + arco superior naranja -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="#FF4D00" stroke-width="3" stroke-linecap="square"/>
  <path d="M16 7 L22 7 Q26 7 26 12 Q26 17 22 17 L16 17" stroke="#FF4D00" stroke-width="3" stroke-linecap="square" fill="none"/>
</svg>
